services:
  immich-shared-albums:
    image: ghcr.io/lukassor/immich-shared-albums:latest
    container_name: immich_shared_albums
    restart: unless-stopped
    env_file: .env
    volumes:
      - isa-data:/data
    networks: [immich]

networks:
  immich:
    external: true
    name: immich_default

volumes:
  isa-data:
